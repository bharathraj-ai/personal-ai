<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Dashboard</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    h1 { color: #333; }\n    ul { list-style-type: disc; margin-left: 20px; }\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Dashboard</h1>\n  <div id=\"content\"></div>\n  <script>\n    function getRole() {\n      const params = new URLSearchParams(window.location.search);\n      return params.get(\"role\") || \"guest\";\n    }\n    function renderDashboard(role) {\n      const title = document.getElementById(\"title\");\n      const content = document.getElementById(\"content\");\n      title.textContent = role.charAt(0).toUpperCase() + role.slice(1) + \" Dashboard\";\n      const sections = {\n        admin: [\"User Management\", \"System Settings\", \"Reports\"],\n        manager: [\"Team Overview\", \"Project Status\", \"Performance\"],\n        user: [\"My Profile\", \"Tasks\", \"Messages\"],\n        guest: [\"Welcome\", \"Login to access more features\"]\n      };\n      const list = document.createElement(\"ul\");\n      (sections[role] || sections[\"guest\"]).forEach(item => {\n        const li = document.createElement(\"li\");\n        li.textContent = item;\n        list.appendChild(li);\n      });\n      content.appendChild(list);\n    }\n    document.addEventListener(\"DOMContentLoaded\", () => {\n      const role = getRole();\n      renderDashboard(role);\n    });\n  </script>\n</body>\n</html>
