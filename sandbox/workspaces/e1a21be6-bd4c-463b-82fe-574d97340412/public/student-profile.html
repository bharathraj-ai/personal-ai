<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student Profile</title>
    <style>
        .field { margin-bottom: 10px; }
        .label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Student Profile</h1>
    <div id="profile"></div>
    <button id="backBtn">Back to List</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const profileDiv = document.getElementById('profile');
        const backBtn = document.getElementById('backBtn');

        if (!id) {
            profileDiv.textContent = 'No student ID provided.';
        } else {
            fetch(`/api/students/${id}`)
                .then(res => {
                    if (!res.ok) throw new Error('Network response was not ok');
                    return res.json();
                })
                .then(student => {
                    profileDiv.innerHTML = `
                        <div class="field"><span class="label">ID:</span> ${student.id}</div>
                        <div class="field"><span class="label">Name:</span> ${student.name}</div>
                        <div class="field"><span class="label">Email:</span> ${student.email}</div>
                    `;
                })
                .catch(err => {
                    profileDiv.textContent = 'Failed to load student.';
                    console.error(err);
                });
        }

        backBtn.addEventListener('click', () => {
            window.location.href = 'students.html';
        });
    </script>
</body>
</html>
