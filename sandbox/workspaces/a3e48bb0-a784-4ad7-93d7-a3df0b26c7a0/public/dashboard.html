<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 20px;}
        .section {display: none; margin-top: 20px;}
        .section.active {display: block;}
    </style>
</head>
<body>
    <h1>Welcome to the Dashboard</h1>
    <p id="greeting"></p>

    <!-- Sections for different roles -->
    <div id="admin" class="section">
        <h2>Admin Panel</h2>
        <p>Here you can manage users, view system metrics, and configure settings.</p>
    </div>

    <div id="manager" class="section">
        <h2>Manager Overview</h2>
        <p>Access reports, approve requests, and monitor team performance.</p>
    </div>

    <div id="employee" class="section">
        <h2>Employee Workspace</h2>
        <p>View your tasks, submit timesheets, and check announcements.</p>
    </div>

    <script>
        // Utility to get query parameters
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // Determine role (expected values: admin, manager, employee)
        const role = getQueryParam('role') || 'employee'; // default to employee
        const greetingEl = document.getElementById('greeting');
        greetingEl.textContent = `You are logged in as: ${role.charAt(0).toUpperCase() + role.slice(1)}`;

        // Show the appropriate section
        const section = document.getElementById(role);
        if (section) {
            section.classList.add('active');
        } else {
            // Fallback if role is unknown
            const fallback = document.createElement('p');
            fallback.textContent = 'Unknown role – no dashboard available.';
            document.body.appendChild(fallback);
        }
    </script>
</body>
</html>
